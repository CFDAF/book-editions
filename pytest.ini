[pytest]
# `tests/` is the offline suite: no network, and the only recorded bodies it
# reads are the ones under `tests/data/`.
testpaths = tests
# An xfail in this suite marks a known-red that a named step will close, so it
# must fail when it starts passing rather than quietly flipping to green.
xfail_strict = true
addopts = -ra --strict-markers
